# Heartbeat for live paper trading (معامله برخط).
# Vercel Hobby crons run at most once a day, so this workflow pings the tick endpoint every 10 minutes.
# Repository → Settings → Secrets and variables → Actions:
#   BOARD_URL    = https://your-app.vercel.app
#   CRON_SECRET  = same value as the Vercel env var
# Note: GitHub may delay scheduled runs by several minutes under load, and disables schedules
# after 60 days without repository activity.
name: paper-tick
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tick
        env:
          BOARD_URL: ${{ secrets.BOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BOARD_URL" ] || [ -z "$CRON_SECRET" ]; then echo "BOARD_URL / CRON_SECRET secrets are not set"; exit 1; fi
          curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" "${BOARD_URL%/}/api/paper/tick"
