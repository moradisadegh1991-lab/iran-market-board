<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>تابلوی بازار</title>
<!--
  Offline shell for the Android app.

  Everything here (markup, styles, logic, fonts) ships inside the APK, so the app opens and
  draws its interface with no network at all. The only thing it asks the network for is the
  data itself, from the Vercel deployment.

  Two deliberate choices:
  1. The last successful snapshot is kept in localStorage. With no connection the app shows
     that, clearly stamped with its age, instead of an empty screen — which is what an app
     used on a spotty Iranian mobile connection actually needs.
  2. No framework and no CDN. A CDN would make the app fail exactly when the network is bad,
     which is the case this shell exists for.
-->
<style>
  /* Variable font, bundled in the APK — one file covers every weight and needs no network.
     The Arabic subset carries Persian; the Latin one is for digits and English tickers. */
  @font-face {
    font-family: 'Vazirmatn'; font-weight: 100 900; font-display: swap;
    src: url('fonts/vazirmatn-arabic-wght-normal.woff2') format('woff2-variations');
    unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFF;
  }
  @font-face {
    font-family: 'Vazirmatn'; font-weight: 100 900; font-display: swap;
    src: url('fonts/vazirmatn-latin-wght-normal.woff2') format('woff2-variations');
  }
  :root {
    --lapis: #1c2c52; --lapis-2: #24375f; --lapis-line: #33456e;
    --paper: #f2f5f8; --surface: #fff; --ink: #16202e; --muted: #61708a;
    --line: #dfe5ec; --teal: #0d7377; --saffron: #f4a300;
    --up: #17804f; --down: #b83a2f;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Vazirmatn, system-ui, 'Segoe UI', Tahoma, sans-serif;
    font-size: 15px; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

  /* ── top bar ── */
  header {
    position: sticky; top: 0; z-index: 30;
    padding: calc(var(--safe-top) + 10px) 14px 10px;
    background: var(--lapis); color: #fff;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; flex: 1; color: var(--saffron); }
  .iconbtn {
    background: none; border: 0; color: #fff; font-size: 22px; line-height: 1;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
  }
  .iconbtn:active { background: rgba(255,255,255,.14); }
  .stamp { font-size: 11.5px; color: #b9c6dd; }
  .stamp.stale { color: #ffcf8a; }

  /* ── drawer (the TGJU-style menu) ── */
  .scrim {
    position: fixed; inset: 0; background: rgba(10,16,28,.45); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  nav#drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(82vw, 320px); z-index: 50;
    background: var(--surface); transform: translateX(100%); transition: transform .24s ease;
    display: flex; flex-direction: column; box-shadow: -12px 0 30px rgba(0,0,0,.18);
  }
  nav#drawer.open { transform: translateX(0); }
  .drawer-head {
    background: var(--lapis); color: #fff; padding: calc(var(--safe-top) + 18px) 16px 16px;
  }
  .drawer-head b { color: var(--saffron); font-size: 19px; display: block; }
  .drawer-head span { font-size: 12.5px; color: #b9c6dd; }
  .drawer-list { overflow-y: auto; padding: 6px 0 calc(var(--safe-bottom) + 12px); flex: 1; }
  .drawer-list button {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: right;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 14px 16px; font: inherit; color: var(--ink); cursor: pointer;
  }
  .drawer-list button .ic { width: 26px; font-size: 18px; text-align: center; }
  .drawer-list button[aria-current='true'] { background: #eef6f6; color: var(--teal); font-weight: 700; }

  /* ── content ── */
  main { padding: 14px 14px calc(var(--safe-bottom) + 28px); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .card h2 { font-size: 15.5px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .label { flex: 1; min-width: 0; }
  .row .label small { display: block; color: var(--muted); font-size: 12px; }
  .row .val { font-weight: 700; font-size: 17px; }
  .row .unit { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-inline-start: 4px; }
  .chg { font-size: 12.5px; font-weight: 700; min-width: 62px; text-align: left; }
  .up { color: var(--up); } .down { color: var(--down); }
  .muted { color: var(--muted); }
  .pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: #eef1f6; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; }
  th { color: var(--muted); font-weight: 400; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .banner { padding: 11px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 13.5px; }
  .banner.warn { background: #fff4d9; border: 1px solid #f0d79a; }
  .banner.err { background: #fde8e5; border: 1px solid #f0bdb5; }
  select, input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; min-width: 0; }
  input { text-align: right; }
  /* the slider needs its own line: without wrapping it overlapped the label text */
  .row.alloc { flex-wrap: wrap; row-gap: 6px; }
  .row.alloc .label { flex: 1 1 auto; }
  input[type=range] { accent-color: var(--teal); padding: 0; width: 100%; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 132px; padding: 14px; }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 5px; }
  .bar-fill { width: 100%; background: var(--teal); border-radius: 5px 5px 0 0; min-height: 2px; }
  .bar small { font-size: 11px; color: var(--muted); }
  .chipbtn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  .addbtn { font: inherit; font-weight: 700; color: #fff; background: var(--teal); border: 0; border-radius: 10px; padding: 11px; cursor: pointer; }
  .addbtn:active { background: #0a5f62; }
  .center { text-align: center; padding: 40px 16px; color: var(--muted); }
  .spin { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .refresh.busy { animation: sp .8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .spin, .refresh.busy { animation: none; } nav#drawer, .scrim { transition: none; } }
</style>
<script>window.BOARD_URL="https://iran-market-board.vercel.app";</script>
</head>
<body>
<header>
  <button class="iconbtn" id="menuBtn" aria-label="منو" aria-expanded="false">☰</button>
  <h1 id="title">تابلوی بازار</h1>
  <span class="stamp" id="stamp"></span>
  <button class="iconbtn refresh" id="refreshBtn" aria-label="به‌روزرسانی">⟳</button>
</header>

<div class="scrim" id="scrim"></div>
<nav id="drawer" aria-label="منوی اصلی">
  <div class="drawer-head">
    <b>تابلوی بازار</b>
    <span>طلا، ارز، کریپتو و بورس</span>
  </div>
  <div class="drawer-list" id="menu"></div>
</nav>

<script src="game-engine.js"></script>
<script src="sms-parser.js"></script>
<main id="view"><div class="center"><span class="spin"></span></div></main>

<script>
(function () {
  'use strict';

  // Set by the build script from BOARD_URL so the same bundle can point at any deployment.
  var API = (window.BOARD_URL || 'https://iran-market-board.vercel.app').replace(/\/$/, '');
  var CACHE_KEY = 'imb.snapshot.v1';

  var PAGES = [
    { id: 'board',     icon: '🏷', title: 'نمای کلی',      render: renderBoard },
    { id: 'risk',      icon: '⚖', title: 'ریسک بازارها',   render: renderRisk },
    { id: 'crypto',    icon: '₿', title: 'کریپتو',         render: renderCrypto },
    { id: 'meme',      icon: '🐸', title: 'میم‌کوین‌ها',    render: renderMeme },
    { id: 'stocks',    icon: '📈', title: 'بورس',           render: renderStocks },
    { id: 'portfolio', icon: '🧺', title: 'سبد پیشنهادی',   render: renderPortfolio },
    { id: 'mine',      icon: '💼', title: 'دارایی‌های من',   render: renderMine, offline: true },
    { id: 'game',      icon: '🎮', title: 'واحد کنترل اقتصاد', render: renderGame, offline: true },
    { id: 'spend',     icon: '🧾', title: 'هزینه‌ها',          render: renderSpend, offline: true },
    { id: 'sources',   icon: '🔌', title: 'وضعیت منابع',    render: renderSources },
    { id: 'about',     icon: 'ℹ', title: 'درباره',         render: renderAbout, offline: true }
  ];

  var snap = null, cachedAt = 0, page = 'board', busy = false, lastError = null;

  var $ = function (id) { return document.getElementById(id); };
  var fa = function (n, d) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    return new Intl.NumberFormat('fa-IR', { maximumFractionDigits: d === undefined ? 0 : d }).format(n);
  };
  var pct = function (n) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    return new Intl.NumberFormat('fa-IR', { maximumFractionDigits: 1, signDisplay: 'exceptZero' }).format(n) + '٪';
  };
  var esc = function (s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var UNIT = { toman: 'تومان', usd: 'دلار', point: 'واحد' };

  // ── drawer ──
  function buildMenu() {
    $('menu').innerHTML = PAGES.map(function (p) {
      return '<button data-page="' + p.id + '" aria-current="' + (p.id === page) + '"><span class="ic">' + p.icon + '</span>' + esc(p.title) + '</button>';
    }).join('');
  }
  function setDrawer(open) {
    $('drawer').classList.toggle('open', open);
    $('scrim').classList.toggle('open', open);
    $('menuBtn').setAttribute('aria-expanded', String(open));
  }
  $('menuBtn').addEventListener('click', function () { setDrawer(!$('drawer').classList.contains('open')); });
  $('scrim').addEventListener('click', function () { setDrawer(false); });
  $('menu').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-page]');
    if (!b) return;
    go(b.getAttribute('data-page'));
    setDrawer(false);
  });
  // Android back button closes the drawer before leaving the app
  document.addEventListener('backbutton', function (e) {
    if ($('drawer').classList.contains('open')) { e.preventDefault(); setDrawer(false); }
  });

  function go(id) {
    page = id;
    buildMenu();
    var p = PAGES.filter(function (x) { return x.id === id; })[0] || PAGES[0];
    $('title').textContent = p.title;
    draw();
    window.scrollTo(0, 0);
  }

  // ── data ──
  function loadCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && o.snap) { snap = o.snap; cachedAt = o.at || 0; }
    } catch (e) { /* a corrupt cache must never stop the app from opening */ }
  }
  function saveCache() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), snap: snap })); } catch (e) {}
  }

  function refresh() {
    if (busy) return;
    busy = true; lastError = null;
    $('refreshBtn').classList.add('busy');
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 20000);
    fetch(API + '/api/snapshot', { signal: ctl.signal, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('کد ' + r.status); return r.json(); })
      .then(function (j) {
        if (j && j.error) throw new Error(j.error);
        snap = j; cachedAt = Date.now(); saveCache();
      })
      .catch(function (e) {
        lastError = (e && e.name === 'AbortError') ? 'زمان انتظار تمام شد' : (e && e.message) || 'خطای نامشخص';
      })
      .then(function () {
        clearTimeout(timer);
        busy = false;
        $('refreshBtn').classList.remove('busy');
        draw();
      });
    draw();
  }
  $('refreshBtn').addEventListener('click', refresh);

  function ageText() {
    if (!cachedAt) return '';
    var min = Math.round((Date.now() - cachedAt) / 60000);
    if (min < 1) return 'هم‌اکنون';
    if (min < 60) return fa(min) + ' دقیقه پیش';
    var h = Math.round(min / 60);
    if (h < 24) return fa(h) + ' ساعت پیش';
    return fa(Math.round(h / 24)) + ' روز پیش';
  }

  function draw() {
    var st = $('stamp');
    st.textContent = busy ? 'در حال به‌روزرسانی…' : ageText();
    st.className = 'stamp' + (!busy && cachedAt && Date.now() - cachedAt > 30 * 60000 ? ' stale' : '');

    var head = '';
    if (lastError) {
      head += '<div class="banner err">به‌روزرسانی نشد: ' + esc(lastError) +
        (snap ? '. داده‌های نمایش‌داده‌شده مربوط به ' + esc(ageText()) + ' است.' : '') + '</div>';
    } else if (snap && Date.now() - cachedAt > 30 * 60000) {
      head += '<div class="banner warn">این اعداد ' + esc(ageText()) + ' دریافت شده‌اند. برای داده تازه، دکمه به‌روزرسانی را بزنید.</div>';
    }

    var cur = PAGES.filter(function (x) { return x.id === page; })[0] || PAGES[0];
    // Holdings live on this phone, so that page must work with no snapshot at all — only the
    // valuation needs prices. Blocking it behind the data check made the user's own records
    // unreachable exactly when the network was down.
    if (!snap && !cur.offline) {
      $('view').innerHTML = head + (busy
        ? '<div class="center"><span class="spin"></span><p>در حال دریافت…</p></div>'
        : '<div class="center"><p>هنوز داده‌ای ذخیره نشده.</p><p class="muted">برای اولین بار به اینترنت نیاز است. بعد از آن، آخرین داده‌ها آفلاین هم نشان داده می‌شوند.</p></div>');
      return;
    }
    var p = PAGES.filter(function (x) { return x.id === page; })[0] || PAGES[0];
    $('view').innerHTML = head + p.render();
    if (page === 'mine') syncDays();
  }

  // ── pages ──
  var LEAD = { usd: 1, coin: 1, g18: 1 };
  function renderBoard() {
    var items = (snap.live && snap.live.items) || [];
    var order = ['usd', 'coin', 'g18', 'usdt', 'ons', 'tse', 'btc', 'eth', 'oilBrent', 'dxy'];
    items = items.slice().sort(function (a, b) {
      var ad = (a.price === null) ? 1 : 0, bd = (b.price === null) ? 1 : 0;
      if (ad !== bd) return ad - bd;
      var ai = order.indexOf(a.key), bi = order.indexOf(b.key);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
    return '<div class="card">' + items.map(function (it) {
      var dir = (it.changePct > 0) ? 'up' : (it.changePct < 0 ? 'down' : '');
      var arrow = it.changePct > 0 ? '▲' : it.changePct < 0 ? '▼' : '';
      return '<div class="row">' +
        '<span class="label">' + esc(it.label) + (it.note ? '<small>' + esc(it.note) + '</small>' : '') + '</span>' +
        (it.price === null
          ? '<span class="muted">در انتظار داده</span>'
          : '<span class="val num">' + fa(it.price, it.unit === 'usd' ? 2 : 0) + '<span class="unit">' + (UNIT[it.unit] || '') + '</span></span>' +
            '<span class="chg num ' + dir + '">' + arrow + ' ' + pct(it.changePct) + '</span>') +
        '</div>';
    }).join('') + '</div>';
  }

  function renderRisk() {
    var risk = (snap.risk || []).filter(function (r) { return !r.hidden; });
    if (!risk.length) return empty('داده ریسک موجود نیست.');
    var hk = ['d1', 'w1', 'm1', 'm3', 'm6', 'y1'];
    var hl = { d1: 'روزانه', w1: 'هفتگی', m1: 'ماهانه', m3: '۳ماهه', m6: '۶ماهه', y1: 'سالانه' };
    return '<div class="card"><h2>ریسک خرید در شش افق</h2><div class="scroll"><table><thead><tr><th>دارایی</th>' +
      hk.map(function (k) { return '<th>' + hl[k] + '</th>'; }).join('') + '</tr></thead><tbody>' +
      risk.map(function (r) {
        return '<tr><th>' + esc(r.label) + '</th>' + hk.map(function (k) {
          var h = r.horizons && r.horizons[k];
          if (!h) return '<td class="muted">—</td>';
          var c = h.buy >= 65 ? 'down' : h.buy <= 40 ? 'up' : '';
          return '<td class="num ' + c + '">' + fa(h.buy) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="row"><span class="muted" style="font-size:12.5px">صفر کم‌ریسک، صد پرریسک. این اعداد توصیه خرید یا فروش نیستند.</span></div></div>';
  }

  function coinTable(rows, title) {
    if (!rows || !rows.length) return empty('فهرستی موجود نیست.');
    return '<div class="card"><h2>' + esc(title) + '</h2><div class="scroll"><table><thead><tr>' +
      '<th>#</th><th>ارز</th><th>قیمت ($)</th><th>۷ روز</th><th>امتیاز</th></tr></thead><tbody>' +
      rows.map(function (c, i) {
        return '<tr><td class="num">' + fa(i + 1) + '</td>' +
          '<td><b>' + esc((c.symbol || '').toUpperCase()) + '</b><br><span class="muted" style="font-size:11.5px">' + esc(c.name) + '</span></td>' +
          '<td class="num">' + fa(c.price, c.price < 1 ? 4 : 2) + '</td>' +
          '<td class="num ' + (c.m7 > 0 ? 'up' : c.m7 < 0 ? 'down' : '') + '">' + pct(c.m7) + '</td>' +
          '<td class="num">' + fa(c.score) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  function renderCrypto() { return coinTable(snap.crypto && snap.crypto.coins, 'کوین‌های مستعد هفته'); }
  function renderMeme() { return coinTable(snap.crypto && snap.crypto.memes, 'میم‌کوین‌های مستعد هفته'); }

  function renderStocks() {
    var s = snap.stocks || {};
    var rows = s.rows || [];
    if (!rows.length) return empty('داده بورس موجود نیست.');
    var note = s.mode === 'warmup'
      ? '<div class="banner warn">تاریخچه بورس هنوز کامل نشده؛ این رتبه‌بندی فقط با داده امروز ساخته شده و اعتبار پایینی دارد.</div>' : '';
    return note + '<div class="card"><h2>سهم‌های مستعد یک‌ماهه</h2><div class="scroll"><table><thead><tr>' +
      '<th>#</th><th>نماد</th><th>قیمت</th><th>امروز</th><th>امتیاز</th></tr></thead><tbody>' +
      rows.map(function (r, i) {
        return '<tr><td class="num">' + fa(i + 1) + '</td>' +
          '<td><b>' + esc(r.symbol) + '</b><br><span class="muted" style="font-size:11.5px">' + esc(r.name) + '</span></td>' +
          '<td class="num">' + fa(r.price) + '</td>' +
          '<td class="num ' + (r.chgPct > 0 ? 'up' : r.chgPct < 0 ? 'down' : '') + '">' + pct(r.chgPct) + '</td>' +
          '<td class="num">' + fa(r.score) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function renderPortfolio() {
    var ps = snap.portfolios || {};
    var prof = snap.defaultProfile || 'balanced';
    var pf = ps[prof] && ps[prof].m3;
    if (!pf) return empty('سبد پیشنهادی موجود نیست.');
    return '<div class="card"><h2>سبد پیشنهادی · افق ۳ ماهه</h2>' +
      pf.lines.map(function (l) {
        return '<div class="row"><span class="label">' + esc(l.label) + '<small>' + esc(l.instrument || '') + '</small></span>' +
          '<span class="val num">' + pct(l.weight * 100) + '</span></div>';
      }).join('') +
      '<div class="row"><span class="label muted">نوسان سالانه تخمینی</span><span class="num">' + pct(pf.annualVolPct) + '</span></div>' +
      '</div>';
  }

  function renderSources() {
    var src = snap.sources || [];
    return '<div class="card"><h2>وضعیت منابع داده</h2>' + src.map(function (s) {
      return '<div class="row"><span class="label">' + esc(s.label || s.name) + '</span>' +
        '<span class="pill" style="' + (s.ok ? 'background:#e4f3ea;color:#17804f' : 'background:#fde8e5;color:#b83a2f') + '">' +
        (s.ok ? 'سالم' : 'خطا') + '</span></div>';

  // ── Jalali calendar (ported from the project's tested implementation) ──
/**
 * Jalali (هجری شمسی) ⇄ Gregorian conversion — no dependencies.
 * Uses the 33-year cycle breakdown of the Birashk/Khayyam algorithm, which matches
 * the official Iranian calendar for 1178–1633 Jalali (covers every date this app needs).
 * Ported from lib/jalali.ts, which is cross-checked against Intl's Persian calendar
 * for ~11k days; this copy is re-checked the same way before shipping.
 */


const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456];

/** NOTE: this algorithm requires division and modulo that truncate toward zero
 *  (the reference implementation uses `~~`). Using Math.floor here silently shifts
 *  g2d by a year for January dates. */
function div(a, b) {
  return Math.trunc(a / b);
}

function mod(a, b) {
  return a - Math.trunc(a / b) * b;
}

/** Leap-year and March-equinox offset data for a Jalali year. */
function jalCal(jy) {
  const bl = BREAKS.length;
  const gy = jy + 621;
  let leapJ = -14;
  let jp = BREAKS[0];
  if (jy < jp || jy >= BREAKS[bl - 1]) throw new Error(`سال جلالی خارج از بازه پشتیبانی‌شده: ${jy}`);
  let jump = 0;
  for (let i = 1; i < bl; i++) {
    const jm = BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(jump % 33, 4);
    jp = jm;
  }
  let n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div((n % 33) + 3, 4);
  if (jump % 33 === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  let leap = mod(mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4; // truncated modulo can go negative
  return { leap, gy, march };
}

/** Days in a Jalali month (1-12). */
function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalali(jy) ? 30 : 29;
}

function isLeapJalali(jy) {
  return jalCal(jy).leap === 0;
}

function g2d(gy, gm, gd) {
  let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * ((gm + 9) % 12) + 2, 5) + gd - 34840408;
  d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}

function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = div(mod(j, 1461), 4) * 5 + 308;
  const gd = div(mod(i, 153), 5) + 1;
  const gm = mod(div(i, 153), 12) + 1;
  const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
  return { gy, gm, gd };
}

/** Jalali → Gregorian. Throws if the Jalali date does not exist (e.g. 30 Esfand in a common year). */
function jalaliToGregorian(jy, jm, jd) {
  if (!Number.isInteger(jy) || !Number.isInteger(jm) || !Number.isInteger(jd)) throw new Error('تاریخ شمسی نامعتبر است.');
  if (jm < 1 || jm > 12) throw new Error('ماه شمسی باید بین ۱ و ۱۲ باشد.');
  if (jd < 1 || jd > jalaliMonthLength(jy, jm)) throw new Error(`روز ${jd} در این ماه شمسی وجود ندارد.`);
  const r = jalCal(jy);
  return d2g(g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1);
}

/** Gregorian → Jalali. */
function gregorianToJalali(gy, gm, gd) {
  const jdn = g2d(gy, gm, gd);
  let jy = gy - 621;
  const r = jalCal(jy);
  const jdn1f = g2d(r.gy, 3, r.march);
  let k = jdn - jdn1f;
  if (k >= 0) {
    if (k <= 185) return { jy, jm: 1 + div(k, 31), jd: mod(k, 31) + 1 };
    k -= 186;
  } else {
    // a Gregorian Jan/Feb date still belongs to the previous Jalali year;
    // the leap flag that matters is the one for that year's own calendar (r, computed above)
    jy -= 1;
    k += 179;
    if (r.leap === 1) k += 1;
  }
  return { jy, jm: 7 + div(k, 30), jd: mod(k, 30) + 1 };
}

const pad = (n) => String(n).padStart(2, '0');

/** 'YYYY-MM-DD' (Gregorian) → Jalali parts. */
function isoToJalali(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return gregorianToJalali(y, m, d);
}

/** Jalali parts → 'YYYY-MM-DD' (Gregorian), the format holdings are stored in. */
function jalaliToIso(jy, jm, jd) {
  const g = jalaliToGregorian(jy, jm, jd);
  return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`;
}

/** 'YYYY-MM-DD' (Gregorian) → '۲۰ شهریور ۱۴۰۵' for display. */
function isoToJalaliLabel(iso) {
  const { jy, jm, jd } = isoToJalali(iso);
  return `${fa(jd)} ${JALALI_MONTHS[jm - 1]} ${fa(jy)}`;
}

    var g18 = boardPrice('g18'), usd = boardPrice('usd'), coin = boardPrice('coin');
    if (g18 && g18.unit === 'toman') out.goldGram = g18.price;
    if (usd && usd.unit === 'toman') out.usd = usd.price;
    // the board carries the full coin; the engine's reference is the half coin
    if (coin && coin.unit === 'toman') out.coinHalf = coin.price / 2;
    return out;
  }

  function gamePlay(E) {
    var s = E.withHelpers ? E.withHelpers(game) : game;
    var free = game.freeDays;
    if (!gameAlloc) gameAlloc = defaultAlloc(free);
    var used = gameAlloc.side + gameAlloc.intl + gameAlloc.venture + gameAlloc.rest;
    var left = free - used;
    var wealth = E.wealthOf(game), real = E.realWealthOf(game), buf = E.bufferMonthsOf(game);
    var keys = [
      { k: 'side', label: 'پروژه جانبی' },
      { k: 'intl', label: 'مسیر بین‌المللی' },

      { k: 'rest', label: 'استراحت' }
    ];

    var notes = (game.note || []).slice(-4).map(function (n) {
      return '<div class="row"><span class="label">' + esc(n) + '</span></div>';
    }).join('');

    return '<div class="card"><h2>' + esc(faDigits(E.monthLabel(game.month))) + ' · ماه ' + fa(game.month + 1) + ' از ' + fa(E.MONTHS) + '</h2>' +
        '<div class="row"><span class="label">دارایی کل</span><span class="val num">' + E.M(wealth) + '<span class="unit">میلیون</span></span></div>' +
        '<div class="row"><span class="label">قدرت خرید واقعی<small>دارایی تعدیل‌شده با تورم</small></span><span class="val num">' + E.M(real) + '<span class="unit">میلیون</span></span></div>' +
        '<div class="row"><span class="label">نقد</span><span class="val num">' + E.M(game.cash) + '<span class="unit">میلیون</span></span></div>' +
        '<div class="row"><span class="label">سپر نقدی<small>چند ماه می‌توانی بدون درآمد دوام بیاوری</small></span><span class="val num ' + (buf < 3 ? 'down' : 'up') + '">' + fa(buf, 1) + '<span class="unit">ماه</span></span></div>' +
        '<div class="row"><span class="label">تورم سالانه</span><span class="val num">' + fa(E.annualInflationOf(game), 0) + '٪</span></div>' +
      '</div>' +
      (notes ? '<div class="card"><h2>رویدادهای ماه گذشته</h2>' + notes + '</div>' : '') +
      '<div class="card"><h2>' + fa(free) + ' روز آزاد این ماه را چطور خرج می‌کنی؟</h2>' +
        keys.map(function (x) {
          return '<div class="row alloc"><span class="label">' + esc(x.label) + '</span>' +
            '<span class="val num" id="gv-' + x.k + '">' + fa(gameAlloc[x.k]) + '</span>' +
            '<input type="range" min="0" max="' + free + '" value="' + gameAlloc[x.k] + '" data-alloc="' + x.k + '" style="flex:1 1 100%" /></div>';
        }).join('') +
        '<div class="row"><span class="label ' + (left < 0 ? 'down' : 'muted') + '" id="gLeft">' +
          (left < 0 ? 'بیش از روزهای آزادت تخصیص داده‌ای (' + fa(-left) + ' روز اضافه)' : fa(left) + ' روز تخصیص‌نیافته') +
        '</span></div>' +
        '<div class="row"><button class="addbtn" id="gNext" style="flex:1 1 100%"' + (left < 0 ? ' disabled' : '') + '>ثبت ماه و رفتن به ماه بعد</button></div>' +
      '</div>' +
      '<div class="card"><div class="row"><button class="iconbtn" id="gReset" style="color:#b83a2f">شروع دوباره از اول</button></div></div>';
  }

  function gameOver(E) {
    var wealth = E.wealthOf(game), real = E.realWealthOf(game);
    var start = game.profile.assets ? 0 : 0;
    return '<div class="card"><h2>پایان ۲۴ ماه</h2>' +
      '<div class="row"><span class="label">دارایی نهایی</span><span class="val num">' + E.M(wealth) + '<span class="unit">میلیون</span></span></div>' +
      '<div class="row"><span class="label">قدرت خرید واقعی</span><span class="val num">' + E.M(real) + '<span class="unit">میلیون</span></span></div>' +
      '<div class="row"><span class="label">تورم انباشته</span><span class="val num">' + fa(game.cpi, 0) + '٪ شاخص</span></div>' +
      '<div class="row"><span class="muted" style="font-size:12.5px">قدرت خرید واقعی مهم‌تر از عدد اسمی است: اگر دارایی‌ات دو برابر شده ولی قیمت‌ها سه برابر شده‌اند، عقب رفته‌ای.</span></div>' +
      '<div class="row"><button class="addbtn" id="gReset" style="flex:1 1 100%">بازی دوباره</button></div>' +
      '</div>';
  }

  // slider + button wiring (delegated, so it survives every re-render)
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute || !t.getAttribute('data-alloc')) return;
    gameAlloc[t.getAttribute('data-alloc')] = Number(t.value);
    var lbl = $('gv-' + t.getAttribute('data-alloc'));
    if (lbl) lbl.textContent = fa(Number(t.value));
    var free = game.freeDays;
    var left = free - (gameAlloc.side + gameAlloc.intl + gameAlloc.venture + gameAlloc.rest);
    var l = $('gLeft'), btn = $('gNext');
    if (l) {
      l.textContent = left < 0 ? 'بیش از روزهای آزادت تخصیص داده‌ای (' + fa(-left) + ' روز اضافه)' : fa(left) + ' روز تخصیص‌نیافته';
      l.className = 'label ' + (left < 0 ? 'down' : 'muted');
    }
    if (btn) btn.disabled = left < 0;
    saveGame();
  });

  document.addEventListener('click', function (e) {
    var E = ecu();
    if (!e.target || !E) return;
    if (e.target.id === 'gStart') {
      var num = function (id, d) { var v = Number(String($(id).value).replace(/[^\d.]/g, '')); return isFinite(v) ? v : d; };
      game = E.newGame({
        jobKey: $('gJob').value,
        income: num('gIncome', 90) * 1e6,
        living: num('gLiving', 30) * 1e6,
        installment: num('gInst', 0) * 1e6,
        freeDays: Math.max(1, num('gFree', 8)),
        inflation: num('gInfl', 60),
        assets: { cash: num('gCash', 50) * 1e6, gold: 0, usd: 0, coin: 0, fixed: 0, equity: 0 },
        prices: startPrices(E)
      });
      gameAlloc = defaultAlloc(game.freeDays);
      saveGame();
      draw();
      return;
    }
    if (e.target.id === 'gNext') {
      game = E.stepMonth(game, gameAlloc);
      saveGame();
      draw();
      window.scrollTo(0, 0);
      return;
    }
    if (e.target.id === 'gReset') {
      if (!confirm('بازی از اول شروع شود؟ پیشرفت فعلی پاک می‌شود.')) return;
      game = null; gameAlloc = null; clearGame();
      draw();
    }
  });


  // ── هزینه‌ها ───────────────────────────────────────────────────────────────
  // Full port of ExpenseTracker: transactions, pending queue, categories, cards,
  // bank senders, per-category breakdown, monthly bars and the AI advisor.
  // Everything lives on the phone. Amounts are stored in RIAL exactly as the bank SMS
  // states them, and converted to toman only for display — mixing the two units is the
  // easiest way to silently corrupt a ledger.
  var TX_KEY = 'imb.tx.v1', TXMETA_KEY = 'imb.txmeta.v1', PEND_KEY = 'imb.pending.v1';
  var CAT_KEY = 'imb.cats.v1', CARD_KEY = 'imb.cards.v1', SENDER_KEY = 'imb.senders.v1';
  var AIKEY_KEY = 'imb.aikey.v1';
  var spendMsg = null, spendTab = 'dash', aiBusy = false, aiAnswer = null;

  var DEFAULT_CATS = [
    { id: 'c1', name: 'خوراک', emoji: '🍽' }, { id: 'c2', name: 'حمل‌ونقل', emoji: '🚗' },
    { id: 'c3', name: 'قبوض', emoji: '🧾' },  { id: 'c4', name: 'خرید', emoji: '🛍' },
    { id: 'c5', name: 'درمان', emoji: '💊' }, { id: 'c6', name: 'مسکن', emoji: '🏠' },
    { id: 'c7', name: 'پس‌انداز', emoji: '🐖' }, { id: 'c8', name: 'سایر', emoji: '💰' }
  ];

  function jget(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } }
  function jset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  function loadTx() { var v = jget(TX_KEY, []); return Array.isArray(v) ? v : []; }
  function saveTx(l) { return jset(TX_KEY, l.slice(0, 3000)); }
  function loadPending() { var v = jget(PEND_KEY, []); return Array.isArray(v) ? v : []; }
  function savePending(l) { return jset(PEND_KEY, l.slice(0, 300)); }
  function loadCats() { var v = jget(CAT_KEY, null); if (!Array.isArray(v)) { jset(CAT_KEY, DEFAULT_CATS); return DEFAULT_CATS.slice(); } return v; }
  function loadCards() { var v = jget(CARD_KEY, []); return Array.isArray(v) ? v : []; }
  function loadSenders() { var v = jget(SENDER_KEY, []); return Array.isArray(v) ? v : []; }
  function txMeta() { return jget(TXMETA_KEY, {}) || {}; }

  function smsPlugin() {
    var C = window.Capacitor;
    return (C && C.Plugins && C.Plugins.SmsReader) ? C.Plugins.SmsReader : null;
  }
  function catById(id) { var c = loadCats().filter(function (x) { return x.id === id; }); return c[0] || null; }
  /** Sender number → bank name, so "985000..." shows as "بانک تجارت". */
  function bankOfSender(addr) {
    var s = loadSenders().filter(function (x) { return addr && String(addr).indexOf(x.sender) >= 0; });
    return s[0] ? s[0].bank : null;
  }
  var toToman = function (rial) { return rial / 10; };

  async function importSms() {
    var plug = smsPlugin(), P = window.SmsParser;
    if (!plug) { spendMsg = { err: 'پلاگین پیامک در دسترس نیست. این قابلیت فقط در نسخه اندروید کار می‌کند.' }; draw(); return; }
    if (!P) { spendMsg = { err: 'پارسر پیامک بارگذاری نشد.' }; draw(); return; }
    spendMsg = { info: 'در حال خواندن پیامک‌ها…' }; draw();
    try {
      var perm = await plug.requestPermission();
      if (!perm || !perm.granted) { spendMsg = { err: 'اجازه خواندن پیامک داده نشد.' }; draw(); return; }
      var meta = txMeta();
      var res = await plug.read({ sinceMs: meta.lastImport || 0, limit: 500 });
      var msgs = (res && res.messages) || [];
      var list = loadTx(), pend = loadPending();
      var seen = {}; list.forEach(function (t) { seen[t.id] = 1; });
      var added = 0, asked = 0, skipped = 0, newest = meta.lastImport || 0;
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        if (m.date > newest) newest = m.date;
        var c = P.classify(m.body || '');
        var id = 'x' + m.date + '-' + ((m.body || '').length);
        if (seen[id]) { skipped++; continue; }      // same message imported twice
        if (c.kind === 'confirmed') {
          list.push({
            id: id, at: m.date, amount: c.tx.amount, out: !!c.tx.isWithdrawal,
            card: c.tx.cardLast4 || null,
            bank: c.tx.bankNameInSms || bankOfSender(m.address) || m.address || null,
            balance: c.tx.balance || null, channel: c.tx.channel || null,
            raw: (m.body || '').slice(0, 300), cat: null,
            transfer: false, typeUnknown: c.tx.directionClear === false, src: 'sms'
          });
          seen[id] = 1; added++;
        } else if (c.kind === 'ambiguous') {
          if (!pend.some(function (p) { return p.id === id; })) {
            pend.push({ id: id, at: m.date, body: (m.body || '').slice(0, 300), amount: c.guessedAmount, out: c.guessedWithdrawal, address: m.address });
            asked++;
          }
        } else skipped++;
      }
      saveTx(list); savePending(pend); jset(TXMETA_KEY, { lastImport: newest });
      spendMsg = { info: fa(added) + ' تراکنش ثبت شد، ' + fa(asked) + ' مورد نیازمند تأیید، ' + fa(skipped) + ' نادیده گرفته شد.' };
    } catch (e) {
      spendMsg = { err: 'خواندن پیامک ناموفق بود: ' + ((e && e.message) || e) };
    }
    draw();
  }

  function monthKeyOf(ms) {
    try { var j = isoToJalali(new Date(ms).toISOString().slice(0, 10)); return j.jy + '/' + j.jm; }
    catch (e) { return '—'; }
  }
  function fmtWhen(ms) {
    try {
      var d = new Date(ms), j = isoToJalali(d.toISOString().slice(0, 10));
      return faPlain(j.jd) + ' ' + J_MONTHS[j.jm - 1] + ' ' + faPlain(j.jy) + '، ' +
        faDigits(String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
    } catch (e) { return '—'; }
  }

  var SPEND_TABS = [
    { k: 'dash', label: 'خلاصه' }, { k: 'tx', label: 'تراکنش‌ها' },
    { k: 'cats', label: 'دسته‌ها' }, { k: 'cards', label: 'کارت‌ها' }, { k: 'ai', label: 'مشاور' }
  ];

  function renderSpend() {
    var tabs = '<div class="chips" style="margin-bottom:12px">' + SPEND_TABS.map(function (t) {
      return '<button aria-pressed="' + (spendTab === t.k) + '" data-stab="' + t.k + '">' + esc(t.label) + '</button>';
    }).join('') + '</div>';
    var body = spendTab === 'tx' ? spendTxTab() : spendTab === 'cats' ? spendCatsTab()
      : spendTab === 'cards' ? spendCardsTab() : spendTab === 'ai' ? spendAiTab() : spendDashTab();
    return tabs + body;
  }

  function spendDashTab() {
    var list = loadTx(), pend = loadPending(), meta = txMeta(), plug = !!smsPlugin();
    var jt = todayJalali(), thisKey = jt.jy + '/' + jt.jm;

    // Transfers between the user's own accounts and unknown-direction rows are excluded
    // from spending, exactly as the original dashboard does — counting a transfer as an
    // expense doubles the month's total.
    var month = list.filter(function (t) { return monthKeyOf(t.at) === thisKey && !t.transfer; });
    var outSum = 0, inSum = 0;
    month.forEach(function (t) { if (t.typeUnknown) return; if (t.out) outSum += t.amount; else inSum += t.amount; });

    var uncat = month.filter(function (t) { return t.out && !t.cat && !t.typeUnknown; });
    var unknown = month.filter(function (t) { return t.typeUnknown; });

    var byCat = {};
    month.filter(function (t) { return t.out && !t.typeUnknown; }).forEach(function (t) {
      byCat[t.cat || '_'] = (byCat[t.cat || '_'] || 0) + t.amount;
    });
    var catRows = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).map(function (k) {
      var c = k === '_' ? null : catById(k);
      var share = outSum ? (byCat[k] / outSum) * 100 : 0;
      return '<div class="row"><span class="label">' + (c ? esc(c.emoji + ' ' + c.name) : '❓ دسته‌بندی‌نشده') +
        '<small>' + fa(share, 0) + '٪ خرج ماه</small></span>' +
        '<span class="val num">' + fa(toToman(byCat[k])) + '<span class="unit">تومان</span></span></div>';
    }).join('');

    // last 6 Jalali months, oldest first
    var bars = [], cursor = { jy: jt.jy, jm: jt.jm };
    for (var i = 0; i < 6; i++) {
      var key = cursor.jy + '/' + cursor.jm;
      var sum = list.filter(function (t) { return monthKeyOf(t.at) === key && t.out && !t.transfer && !t.typeUnknown; })
        .reduce(function (a, t) { return a + t.amount; }, 0);
      bars.unshift({ label: J_MONTHS[cursor.jm - 1], v: sum });
      cursor.jm--; if (cursor.jm < 1) { cursor.jm = 12; cursor.jy--; }
    }
    var max = Math.max.apply(null, bars.map(function (b) { return b.v; }).concat([1]));
    var chart = '<div class="card"><h2>شش ماه گذشته</h2><div class="bars">' + bars.map(function (b) {
      return '<div class="bar"><span class="bar-fill" style="height:' + Math.max(2, (b.v / max) * 100) + '%"></span>' +
        '<small>' + esc(b.label) + '</small></div>';
    }).join('') + '</div><div class="row"><span class="muted" style="font-size:12.5px">بلندترین ستون: ' + fa(toToman(max)) + ' تومان</span></div></div>';

    return '<div class="card"><h2>' + esc(J_MONTHS[jt.jm - 1]) + ' ' + faPlain(jt.jy) + '</h2>' +
        '<div class="row"><span class="label">خرج این ماه</span><span class="val num down">' + fa(toToman(outSum)) + '<span class="unit">تومان</span></span></div>' +
        '<div class="row"><span class="label">ورودی این ماه</span><span class="val num up">' + fa(toToman(inSum)) + '<span class="unit">تومان</span></span></div>' +
        '<div class="row"><span class="label">مانده</span><span class="val num ' + (inSum - outSum >= 0 ? 'up' : 'down') + '">' + fa(toToman(inSum - outSum)) + '<span class="unit">تومان</span></span></div>' +
        (uncat.length ? '<div class="row"><span class="label" style="color:var(--down)">⚠️ ' + fa(uncat.length) + ' تراکنش دسته‌بندی‌نشده</span></div>' : '') +
        (unknown.length ? '<div class="row"><span class="label muted">❔ ' + fa(unknown.length) + ' تراکنش با جهت نامشخص (در جمع نیامده)</span></div>' : '') +
        (pend.length ? '<div class="row"><span class="label muted">❓ ' + fa(pend.length) + ' پیامک نیازمند تأیید</span></div>' : '') +
        '<div class="row"><span class="muted" style="font-size:12.5px">پیامک بانکی به ریال است؛ اعداد بالا به تومان تبدیل شده‌اند.</span></div>' +
      '</div>' +
      '<div class="card"><h2>دریافت از پیامک بانکی</h2>' +
        '<div class="row"><span class="label">' + (plug
          ? 'پیامک‌ها روی همین گوشی خوانده و تحلیل می‌شوند. متن پیامک هیچ‌جا فرستاده نمی‌شود.'
          : 'این قابلیت به نسخه اندروید نیاز دارد. در مرورگر می‌توانید تراکنش را دستی ثبت کنید.') + '</span></div>' +
        (meta.lastImport ? '<div class="row"><span class="label muted">آخرین دریافت</span><span>' + esc(fmtWhen(meta.lastImport)) + '</span></div>' : '') +
        (plug ? '<div class="row"><button class="addbtn" id="sImport" style="flex:1 1 100%">خواندن پیامک‌های جدید</button></div>' : '') +
        (spendMsg ? '<div class="row"><span class="' + (spendMsg.err ? 'down' : 'muted') + '">' + esc(spendMsg.err || spendMsg.info) + '</span></div>' : '') +
      '</div>' +
      (catRows ? '<div class="card"><h2>به تفکیک دسته</h2>' + catRows + '</div>' : '') +
      chart +
      spendPendingCard();
  }

  function spendPendingCard() {
    var pend = loadPending();
    if (!pend.length) return '';
    var cats = loadCats();
    return '<div class="card"><h2>نیازمند تأیید شما (' + fa(pend.length) + ')</h2>' +
      '<div class="row"><span class="muted" style="font-size:12.5px">این پیامک‌ها نشانه مالی داشتند ولی مبلغ یا جهتشان قطعی نبود، پس خودکار ثبت نشدند.</span></div>' +
      pend.slice(0, 10).map(function (p, i) {
        return '<div class="row alloc"><span class="label" style="font-size:13px">' + esc(p.body.slice(0, 120)) + '</span>' +
          '<span class="val num">' + (p.amount ? fa(toToman(p.amount)) : '—') + '</span>' +
          '<button class="chipbtn" data-pok="' + i + '">ثبت به‌عنوان ' + (p.out ? 'خرج' : 'ورودی') + '</button>' +
          '<button class="chipbtn" data-pflip="' + i + '">برعکس کن</button>' +
          '<button class="chipbtn" data-pno="' + i + '">نادیده</button></div>';
      }).join('') + '</div>';
  }

  function spendTxTab() {
    var list = loadTx().slice().sort(function (a, b) { return b.at - a.at; });
    var cats = loadCats();
    if (!list.length) return '<div class="card"><div class="row"><span class="muted">هنوز تراکنشی ثبت نشده.</span></div></div>' + spendManualCard();
    var opts = function (sel) {
      return '<option value="">دسته…</option>' + cats.map(function (c) {
        return '<option value="' + c.id + '"' + (sel === c.id ? ' selected' : '') + '>' + esc(c.emoji + ' ' + c.name) + '</option>';
      }).join('');
    };
    return '<div class="card"><h2>تراکنش‌ها (' + fa(list.length) + ')</h2>' +
      list.slice(0, 60).map(function (t) {
        return '<div class="row alloc"><span class="label">' +
            (t.typeUnknown ? '❔ نامشخص' : t.out ? 'خرج' : 'ورودی') + (t.transfer ? ' · جابه‌جایی' : '') +
            '<small>' + esc(fmtWhen(t.at)) + (t.card ? ' · کارت ' + esc(t.card) : '') + (t.bank ? ' · ' + esc(String(t.bank).slice(0, 18)) : '') + '</small></span>' +
          '<span class="val num ' + (t.typeUnknown ? '' : t.out ? 'down' : 'up') + '">' + fa(toToman(t.amount)) + '<span class="unit">تومان</span></span>' +
          '<button class="iconbtn" style="color:#b83a2f" data-txdel="' + esc(t.id) + '" aria-label="حذف">✕</button>' +
          '<select data-txcat="' + esc(t.id) + '" style="flex:1 1 40%">' + opts(t.cat) + '</select>' +
          '<button class="chipbtn" data-txtr="' + esc(t.id) + '">' + (t.transfer ? 'جابه‌جایی نیست' : 'جابه‌جایی بین حساب‌ها') + '</button>' +
          (t.typeUnknown ? '<button class="chipbtn" data-txfix="' + esc(t.id) + '">این خرج بود</button>' : '') +
          '</div>';
      }).join('') + '</div>' + spendManualCard();
  }

  function spendManualCard() {
    var cats = loadCats();
    return '<div class="card"><h2>ثبت دستی</h2><div class="row" style="flex-wrap:wrap;gap:8px">' +
      '<select id="sDir" aria-label="نوع" style="flex:1 1 30%"><option value="out">خرج</option><option value="in">ورودی</option></select>' +
      '<input id="sAmt" inputmode="numeric" placeholder="مبلغ (تومان)" aria-label="مبلغ" style="flex:1 1 40%" />' +
      '<select id="sCat" aria-label="دسته" style="flex:1 1 25%"><option value="">دسته…</option>' +
        cats.map(function (c) { return '<option value="' + c.id + '">' + esc(c.emoji + ' ' + c.name) + '</option>'; }).join('') +
      '</select>' +
      '<button class="addbtn" id="sAdd" style="flex:1 1 100%">افزودن</button>' +
      '</div></div>';
  }

  function spendCatsTab() {
    var cats = loadCats(), list = loadTx();
    return '<div class="card"><h2>دسته‌ها</h2>' + cats.map(function (c) {
      var n = list.filter(function (t) { return t.cat === c.id; }).length;
      return '<div class="row"><span class="label">' + esc(c.emoji + ' ' + c.name) + '<small>' + fa(n) + ' تراکنش</small></span>' +
        '<button class="iconbtn" style="color:#b83a2f" data-catdel="' + esc(c.id) + '" aria-label="حذف">✕</button></div>';
    }).join('') +
    '<div class="row" style="flex-wrap:wrap;gap:8px">' +
      '<input id="cEmoji" placeholder="🙂" aria-label="ایموji" style="flex:0 0 68px;text-align:center" />' +
      '<input id="cName" placeholder="نام دسته" aria-label="نام دسته" style="flex:1 1 55%" />' +
      '<button class="addbtn" id="cAdd" style="flex:1 1 100%">افزودن دسته</button>' +
    '</div></div>';
  }

  function spendCardsTab() {
    var cards = loadCards(), senders = loadSenders();
    return '<div class="card"><h2>کارت‌ها</h2>' +
      (cards.length ? cards.map(function (c) {
        return '<div class="row"><span class="label">' + esc(c.title) + '<small>' + esc(c.bank || '') + ' · ' + esc(c.last4) + '</small></span>' +
          '<button class="iconbtn" style="color:#b83a2f" data-carddel="' + esc(c.id) + '" aria-label="حذف">✕</button></div>';
      }).join('') : '<div class="row"><span class="muted">کارتی ثبت نشده.</span></div>') +
      '<div class="row" style="flex-wrap:wrap;gap:8px">' +
        '<input id="kLast4" inputmode="numeric" maxlength="4" placeholder="۴ رقم آخر" aria-label="چهار رقم آخر" style="flex:1 1 28%" />' +
        '<input id="kTitle" placeholder="عنوان (مثلاً کارت حقوق)" aria-label="عنوان" style="flex:1 1 65%" />' +
        '<input id="kBank" placeholder="بانک" aria-label="بانک" style="flex:1 1 100%" />' +
        '<button class="addbtn" id="kAdd" style="flex:1 1 100%">افزودن کارت</button>' +
      '</div></div>' +
      '<div class="card"><h2>شماره‌های بانک</h2>' +
        '<div class="row"><span class="muted" style="font-size:12.5px">شماره فرستنده پیامک را به نام بانک وصل می‌کند تا در فهرست تراکنش‌ها نام بانک نشان داده شود.</span></div>' +
        (senders.length ? senders.map(function (s2) {
          return '<div class="row"><span class="label">' + esc(s2.bank) + '<small>' + esc(s2.sender) + '</small></span>' +
            '<button class="iconbtn" style="color:#b83a2f" data-senddel="' + esc(s2.id) + '" aria-label="حذف">✕</button></div>';
        }).join('') : '<div class="row"><span class="muted">موردی ثبت نشده.</span></div>') +
        '<div class="row" style="flex-wrap:wrap;gap:8px">' +
          '<input id="nSender" placeholder="شماره یا نام فرستنده" aria-label="فرستنده" style="flex:1 1 55%" />' +
          '<input id="nBank" placeholder="نام بانک" aria-label="نام بانک" style="flex:1 1 40%" />' +
          '<button class="addbtn" id="nAdd" style="flex:1 1 100%">افزودن</button>' +
        '</div></div>';
  }

  /** Builds the same 30-day summary the Kotlin advisor sent, so answers stay comparable. */
  function aiSummary() {
    var since = Date.now() - 30 * 86400000;
    var txs = loadTx().filter(function (t) { return t.at >= since && !t.transfer; });
    var lines = ['خلاصه تراکنش‌های ۳۰ روز اخیر کاربر (مبالغ به ریال):'];
    var by = {};
    txs.filter(function (t) { return t.out && !t.typeUnknown; }).forEach(function (t) {
      var k = t.cat || '_'; by[k] = by[k] || { n: 0, sum: 0 }; by[k].n++; by[k].sum += t.amount;
    });
    Object.keys(by).forEach(function (k) {
      var c = k === '_' ? null : catById(k);
      lines.push('- ' + (c ? c.name : 'دسته‌بندی‌نشده') + ': ' + by[k].n + ' تراکنش، مجموع ' + by[k].sum);
    });
    lines.push('مجموع واریزی‌ها: ' + txs.filter(function (t) { return !t.out && !t.typeUnknown; }).reduce(function (a, t) { return a + t.amount; }, 0));
    return lines.join('\n');
  }

  function spendAiTab() {
    var key = localStorage.getItem(AIKEY_KEY) || '';
    return '<div class="card"><h2>مشاور مالی</h2>' +
      '<div class="row"><span class="label">خلاصه تراکنش‌های ۳۰ روز اخیر شما به سرویس هوش مصنوعی فرستاده می‌شود تا تحلیل بدهد. <b>کلید API خودتان لازم است</b> و روی همین گوشی ذخیره می‌شود.<br>' +
      'توجه: برخلاف بقیه بخش‌ها، این یکی داده را به یک سرویس بیرونی می‌فرستد — البته فقط خلاصه اعداد، نه متن پیامک‌ها.</span></div>' +
      '<div class="row" style="flex-wrap:wrap;gap:8px">' +
        '<input id="aiKey" type="password" placeholder="OpenRouter API key" aria-label="کلید" value="' + esc(key) + '" style="flex:1 1 100%" />' +
        '<input id="aiQ" placeholder="سوالت را بنویس، مثلاً: کجا زیاد خرج می‌کنم؟" aria-label="سوال" style="flex:1 1 100%" />' +
        '<button class="addbtn" id="aiAsk" style="flex:1 1 100%"' + (aiBusy ? ' disabled' : '') + '>' + (aiBusy ? 'در حال پرسیدن…' : 'بپرس') + '</button>' +
      '</div>' +
      (aiAnswer ? '<div class="row"><span class="label" style="white-space:pre-wrap">' + esc(aiAnswer) + '</span></div>' : '') +
      '</div>' +
      '<div class="card"><h2>خلاصه‌ای که فرستاده می‌شود</h2><div class="row"><span class="label muted" style="white-space:pre-wrap;font-size:12.5px">' + esc(aiSummary()) + '</span></div></div>';
  }

  async function askAi() {
    var key = String(($('aiKey') || {}).value || '').trim();
    var q = String(($('aiQ') || {}).value || '').trim();
    if (!key) { aiAnswer = 'کلید API وارد نشده.'; draw(); return; }
    if (!q) { aiAnswer = 'سوالت را بنویس.'; draw(); return; }
    localStorage.setItem(AIKEY_KEY, key);
    aiBusy = true; aiAnswer = null; draw();
    try {
      var r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({
          model: 'deepseek/deepseek-chat:free',
          messages: [{ role: 'user', content: aiSummary() + '\n\nسوال کاربر: ' + q }]
        })
      });
      var j = await r.json();
      if (!r.ok || j.error) throw new Error((j.error && (j.error.message || j.error)) || ('خطای ' + r.status));
      aiAnswer = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || 'پاسخی برنگشت.';
    } catch (e) {
      aiAnswer = 'خطا: ' + ((e && e.message) || e);
    }
    aiBusy = false; draw();
  }

  document.addEventListener('change', function (e) {
    var t = e.target; if (!t || !t.getAttribute) return;
    var id = t.getAttribute('data-txcat');
    if (id) {
      var l = loadTx();
      l.forEach(function (x) { if (x.id === id) x.cat = t.value || null; });
      saveTx(l);
    }
  });

  document.addEventListener('click', function (e) {
    var t = e.target; if (!t) return;
    var g = function (a) { return t.getAttribute && t.getAttribute(a); };

    var tab = g('data-stab');
    if (tab) { spendTab = tab; aiAnswer = null; draw(); return; }
    if (t.id === 'sImport') { importSms(); return; }
    if (t.id === 'aiAsk') { askAi(); return; }

    if (t.id === 'sAdd') {
      var amt = Number(String($('sAmt').value).replace(/[^\d]/g, ''));
      if (!isFinite(amt) || amt <= 0) return;
      var l1 = loadTx();
      // stored in rial like the SMS rows, so the two never mix units
      l1.push({ id: 'm' + Date.now(), at: Date.now(), amount: amt * 10, out: $('sDir').value === 'out',
        card: null, bank: null, balance: null, channel: null, raw: '', cat: $('sCat').value || null,
        transfer: false, typeUnknown: false, src: 'manual' });
      saveTx(l1); spendMsg = null; draw(); return;
    }
    if (t.id === 'cAdd') {
      var name = String($('cName').value).trim(); if (!name) return;
      var cats = loadCats();
      cats.push({ id: 'c' + Date.now(), name: name, emoji: String($('cEmoji').value).trim() || '💰' });
      jset(CAT_KEY, cats); draw(); return;
    }
    if (t.id === 'kAdd') {
      var l4 = String($('kLast4').value).replace(/[^\d]/g, '').slice(-4); if (l4.length !== 4) return;
      var cards = loadCards();
      cards.push({ id: 'k' + Date.now(), last4: l4, title: String($('kTitle').value).trim() || ('کارت ' + l4), bank: String($('kBank').value).trim() });
      jset(CARD_KEY, cards); draw(); return;
    }
    if (t.id === 'nAdd') {
      var snd = String($('nSender').value).trim(), bnk = String($('nBank').value).trim();
      if (!snd || !bnk) return;
      var ss = loadSenders(); ss.push({ id: 'n' + Date.now(), sender: snd, bank: bnk });
      jset(SENDER_KEY, ss); draw(); return;
    }

    var d1 = g('data-txdel');
    if (d1) { saveTx(loadTx().filter(function (x) { return x.id !== d1; })); draw(); return; }
    var d2 = g('data-catdel');
    if (d2) {
      if (!confirm('این دسته حذف شود؟ تراکنش‌هایش بدون دسته می‌شوند.')) return;
      jset(CAT_KEY, loadCats().filter(function (x) { return x.id !== d2; }));
      var lt = loadTx(); lt.forEach(function (x) { if (x.cat === d2) x.cat = null; }); saveTx(lt);
      draw(); return;
    }
    var d3 = g('data-carddel');
    if (d3) { jset(CARD_KEY, loadCards().filter(function (x) { return x.id !== d3; })); draw(); return; }
    var d4 = g('data-senddel');
    if (d4) { jset(SENDER_KEY, loadSenders().filter(function (x) { return x.id !== d4; })); draw(); return; }

    var tr = g('data-txtr');
    if (tr) { var l5 = loadTx(); l5.forEach(function (x) { if (x.id === tr) x.transfer = !x.transfer; }); saveTx(l5); draw(); return; }
    var fx = g('data-txfix');
    if (fx) { var l6 = loadTx(); l6.forEach(function (x) { if (x.id === fx) { x.typeUnknown = false; x.out = true; } }); saveTx(l6); draw(); return; }

    var pk = g('data-pok'), pf = g('data-pflip'), pn = g('data-pno');
    if (pk || pf || pn) {
      var pend = loadPending();
      var idx = Number(pk || pf || pn);
      var p = pend[idx]; if (!p) return;
      if (pf) { p.out = !p.out; savePending(pend); draw(); return; }
      if (pk && p.amount) {
        var l7 = loadTx();
        l7.push({ id: p.id, at: p.at, amount: p.amount, out: !!p.out, card: null,
          bank: bankOfSender(p.address) || p.address || null, balance: null, channel: null,
          raw: p.body, cat: null, transfer: false, typeUnknown: false, src: 'sms-confirmed' });
        saveTx(l7);
      }
      pend.splice(idx, 1); savePending(pend); draw();
    }
  });

  // ── start ──
  loadCache();
  buildMenu();
  go('board');
  refresh();
  // refresh when the app comes back to the foreground, but only if the data is getting old
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - cachedAt > 5 * 60000) refresh();
  });
})();
</script>
</body>
</html>
